<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  @font-face { font-family: StoreDisplay; src: url("../../public/fonts/coolvetica.otf"); font-display: block; }
  @font-face { font-family: StoreBody; src: url("../../public/fonts/inter.woff2"); font-display: block; }
  :root {
    --bg: #0f1115; --card: #1c2028; --ink: #f3f4f8; --muted: #a8adba; --faint: #717786; --line: #2c313c;
  }
  * { margin: 0; box-sizing: border-box; }
  html, body { width: 100%; height: 100%; overflow: hidden; background: var(--bg); color: var(--ink); font-family: StoreBody, sans-serif; }
  body { position: relative; visibility: hidden; }
  body.ready { visibility: visible; }
  body::before {
    content: ""; position: absolute; inset: 0; pointer-events: none; z-index: -1;
    background: radial-gradient(ellipse 60% 70% at 78% 50%, rgba(255,255,255,.06), transparent 70%);
  }

  .brand { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 15px; letter-spacing: .22em; text-transform: uppercase; }
  .brand svg { width: 16px; height: 30px; }
  h1 { font-family: StoreDisplay, sans-serif; font-weight: normal; letter-spacing: -.01em; line-height: .95; }
  p.sub { color: var(--muted); line-height: 1.5; }

  .phone {
    border-radius: 34px; overflow: hidden; border: 1px solid var(--line);
    box-shadow: 0 40px 80px rgba(0,0,0,.55), 0 0 0 8px #15181e;
  }
  .phone img { display: block; width: 100%; }

  /* 1280x800 store screenshot */
  .shot { display: grid; grid-template-columns: 1fr 360px; align-items: center; gap: 72px; height: 100%; padding: 0 120px 0 110px; }
  .shot .copy { display: flex; flex-direction: column; gap: 28px; }
  .shot h1 { font-size: 92px; }
  .shot p.sub { font-size: 22px; max-width: 520px; }
  .shot .phone { height: 720px; width: max-content; justify-self: center; }
  .shot .phone img { height: 100%; width: auto; }

  /* 440x280 small promo tile */
  .small { display: flex; flex-direction: column; justify-content: center; gap: 16px; height: 100%; padding: 0 44px; }
  .small .row { display: flex; align-items: center; gap: 18px; }
  .small .row svg { width: 34px; height: 64px; }
  .small h1 { font-size: 72px; }
  .small p.sub { font-size: 16px; }

  /* 1400x560 marquee */
  .marquee { display: grid; grid-template-columns: 1fr 640px; align-items: center; height: 100%; padding-left: 110px; }
  .marquee .copy { display: flex; flex-direction: column; gap: 26px; }
  .marquee h1 { font-size: 76px; }
  .marquee p.sub { font-size: 22px; max-width: 520px; }
  .marquee .phones { position: relative; height: 100%; }
  .marquee .phone { position: absolute; width: 230px; }
  .marquee .phone:nth-child(1) { left: 10px;  top: 130px; transform: rotate(-6deg); opacity: .8; }
  .marquee .phone:nth-child(2) { left: 200px; top: 56px;  z-index: 2; }
  .marquee .phone:nth-child(3) { left: 390px; top: 130px; transform: rotate(6deg); opacity: .8; }
</style>
</head>
<body>
<template id="logo">
  <svg viewBox="330 150 420 780" fill="none"><path d="M406.667 745.923C406.667 915.79 673.333 915.79 673.333 745.923C673.333 576.09 406.667 508.157 406.667 321.292C406.667 168.458 673.333 168.458 673.333 321.292C673.333 508.157 406.667 576.093 406.667 745.96V745.923Z" stroke="currentColor" stroke-width="70" stroke-linecap="round" stroke-linejoin="round"/></svg>
</template>
<script>
  const shots = "../../docs/screenshots/";
  const slides = {
    usage:    ["See where your time really goes.", "Today's total, a weekly graph and every site, counted only while you are actually looking."],
    warning:  ["A pause, not a punishment.", "Calm warning screens ask you to type a sentence, state an intent or simply wait before you go on."],
    "focus-setup": ["Focus without the noise.", "Pick a focus group and Curbox holds back the sites that pull you away."],
    focus:    ["Pomodoro, built in.", "Focus rounds with short breaks between them. Every round is logged."],
    reducers: ["Make scrolling less rewarding.", "Gentle Prompts, a grayscale filter and a UI hider for feeds, Shorts and comments."],
  };
  const logo = document.getElementById("logo").innerHTML;
  const brand = `<div class="brand">${logo}Curbox</div>`;
  const phone = (name) => `<div class="phone"><img src="${shots}${name}.png"></div>`;
  const kind = new URLSearchParams(location.search).get("kind");

  let html;
  if (kind === "small") {
    html = `<div class="small"><div class="row">${logo}<h1>Curbox</h1></div><p class="sub">Browse mindfully. Block gently.</p></div>`;
  } else if (kind === "marquee") {
    html = `<div class="marquee">
      <div class="copy">${brand}<h1>Stay conscious of your time online.</h1><p class="sub">Screen time, website blocking and focus sessions. Private, open source and calm.</p></div>
      <div class="phones">${phone("reducers")}${phone("usage")}${phone("focus")}</div>
    </div>`;
  } else {
    const [title, sub] = slides[kind];
    html = `<div class="shot"><div class="copy">${brand}<h1>${title}</h1><p class="sub">${sub}</p></div>${phone(kind)}</div>`;
  }
  document.body.insertAdjacentHTML("beforeend", html);
  Promise.all([
    document.fonts.load('92px StoreDisplay'),
    document.fonts.load('22px StoreBody'),
    ...[...document.images].map((img) => img.decode()),
  ]).then(() => document.body.classList.add("ready"));
</script>
</body>
</html>
